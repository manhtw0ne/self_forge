spring:
  application:
    name: selfforge
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:file:./data/discipline-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
