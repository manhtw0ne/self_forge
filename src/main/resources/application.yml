spring:
  application:
    name: selfforge
  datasource:
    url: jdbc:h2:file:./data/discipline-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
