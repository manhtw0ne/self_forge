spring:
  flyway:
    enabled: false
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: selfforge
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:file:./data/discipline-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

app:
  registration:
    require-email-verification: ${REGISTRATION_REQUIRE_EMAIL_VERIFICATION:false}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    from: ${PASSWORD_RESET_FROM:}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
