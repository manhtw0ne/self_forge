name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run audit:runtime && npm run lint && npm test && npm run test:oauth && npm run test:passwords && npm run build
        working-directory: frontend
      - run: cp -r frontend/dist/. src/main/resources/static/
      - run: mvn -B -Ppostgres-tests verify
      - name: Build production image
        run: docker build -t selfforge:release-check .
      - name: Verify production flows and restart persistence
        shell: pwsh
        run: ./scripts/smoke-production.ps1
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
